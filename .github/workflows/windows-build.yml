name: Static MozJPEG Release

on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: 4.5.2

jobs:
  build:
    name: Build and Release MozJPEG static binaries
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🛠 Install NASM
        run: choco install nasm -y
        shell: powershell

      - name: 📦 Install vcpkg + static dependencies
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install zlib:x64-windows-static libpng:x64-windows-static
        shell: powershell

      - name: 📂 Create build directory
        run: |
          mkdir static
          mkdir shared

      - name: ⚙️ Configure CMake
        run: |
          cd static
          cmake .. ^
            -G "Visual Studio 18 2026" ^
            -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DCMAKE_PREFIX_PATH="D:/a/mozjpeg/mozjpeg/vcpkg/installed/x64-windows-static" ^
            -DBUILD_SHARED_LIBS=ON ^
            -DWITH_TURBOJPEG=ON ^
            -DWITH_JAVA=OFF ^
            -DENABLE_SHARED=OFF ^
            -DPNG_SUPPORTED=0 ^
            -DENABLE_STATIC=ON ^
            -DWITH_EXAMPLES=ON
          cd ../shared
          cmake .. ^
            -G "Visual Studio 18 2026" ^
            -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DCMAKE_PREFIX_PATH="D:/a/mozjpeg/mozjpeg/vcpkg/installed/x64-windows-static" ^
            -DBUILD_SHARED_LIBS=ON ^
            -DWITH_TURBOJPEG=ON ^
            -DWITH_JAVA=OFF ^
            -DENABLE_SHARED=ON ^
            -DPNG_SUPPORTED=0 ^
            -DENABLE_STATIC=OFF ^
            -DWITH_EXAMPLES=ON
          cd ../
          
        shell: cmd

      - name: 🧱 Build project
        run: |
          cmake --build static --config Release
          cmake --build shared --config Release
          7z a -mqs -mx=9 -ms=on ar1.7z -ir!*lib -ir!*log -ir!*obj
        shell: cmd

      - name: Upload Windows x64
        uses: actions/upload-artifact@v7
        with:
          name: x64rel
          path: .\*.7z


      #- name: 📦 Upload to GitHub Release
      #  uses: softprops/action-gh-release@v2
